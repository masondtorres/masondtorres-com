name: Vercel domain auth check

on:
  push:
    paths:
      - .github/workflows/vercel-domain-auth-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_A: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_B: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_C: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Check available Vercel credentials safely
        shell: bash
        run: |
          set +x
          TEAM_ID='team_20Vq4J5oHxCfaktQIYc4wu0t'
          URL="https://api.vercel.com/v9/projects/masondtorres-site/domains?teamId=${TEAM_ID}"
          FOUND=0
          for NAME in A B C; do
            VAR="VERCEL_TOKEN_${NAME}"
            TOKEN="${!VAR}"
            if [ -n "$TOKEN" ]; then
              FOUND=1
              STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL" || true)
              echo "TOKEN_${NAME}_PRESENT=true API_STATUS=${STATUS}"
            else
              echo "TOKEN_${NAME}_PRESENT=false"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo 'NO_CANDIDATE_VERCEL_TOKEN_FOUND=true'
          fi
