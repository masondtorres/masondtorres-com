name: Materialize website source
on:
  push:
    branches: [main]
    paths:
      - 'site.bundle.part-*'
      - scripts/materialize.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/materialize.mjs
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already materialized"
          else
            git commit -m "Materialize complete website source"
            git push origin HEAD:main
          fi
