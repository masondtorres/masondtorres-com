name: Materialize production source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-clean.mjs'
      - 'source.clean-*'
      - 'source.zip.tail-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified source archive
        run: node scripts/materialize-clean.mjs
      - name: Commit readable source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Materialize complete production source tree"
            git push origin main
          fi
